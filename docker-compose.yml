services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: earning
      POSTGRES_USER: earning
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earning -d earning"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://earning:${DB_PASSWORD:-change_me}@db:5432/earning
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  bot:
    build: .
    command: ["python", "-m", "app.bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://earning:${DB_PASSWORD:-change_me}@db:5432/earning
    depends_on:
      db:
        condition: service_healthy
    profiles: ["bot"]
volumes:
  pgdata:
